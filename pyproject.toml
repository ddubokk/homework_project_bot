[tool.poetry]
name = "homework_project 3"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
package-mode = true
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.14"
requests = "^2.34.2"
pytelegrambotapi = "^4.37.1"
python-dotenv = "^1.2.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "requests (>=2.34.2,<3.0.0)"
]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "mypy (>=2.4.0,<3.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py в корне проекта
)
'''

[tool.isort]
line_length = 119
profile = "black"


[tool.pytest.ini_options]
pythonpath = ["src"]